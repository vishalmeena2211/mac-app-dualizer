<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161618"/><stop offset="1" stop-color="#232327"/></linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c31"/><stop offset="1" stop-color="#1b1b1e"/></linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- the GUI's warm glow, top right -->
  <circle cx="1820" cy="-80" r="520" fill="#d97757" opacity="0.06"/>
  <!-- title -->
  <text x="120" y="150" font-size="92" font-weight="700" fill="#f4f4f7" letter-spacing="-2">mac-app-dualizer</text>
  <text x="124" y="208" font-size="34" fill="#f4f4f7" opacity="0.85">One Mac app, cloned into two. Each copy keeps its own data folder and its own login.</text>

  <!-- source app icon: the GUI's two-squares glyph -->
  <g transform="translate(120,340)">
    <rect width="160" height="160" rx="36" fill="url(#icon)" stroke="#45454e" stroke-width="2"/>
    <g transform="scale(3.3333)">
      <rect x="7" y="7" width="26" height="26" rx="6" fill="none" stroke="#6c6c78" stroke-width="2.5"/>
      <rect x="15" y="15" width="26" height="26" rx="6" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2.5"/>
    </g>
  </g>
  <text x="200" y="536" font-size="22" fill="#f4f4f7" opacity="0.7" text-anchor="middle">Claude.app</text>

  <!-- the fork: one app becomes two -->
  <g fill="none" stroke="#9d9da8" stroke-width="3" stroke-linejoin="round">
    <path d="M 286 420 H 360 V 355 H 504"/>
    <path d="M 360 420 V 505 H 504"/>
  </g>
  <polygon points="504,346 520,355 504,364" fill="#9d9da8"/>
  <polygon points="504,496 520,505 504,514" fill="#9d9da8"/>

  <!-- row A: the original -->
  <g transform="translate(520,290)">
    <rect width="1280" height="130" rx="16" fill="#232327" stroke="#33333a"/>
    <g transform="translate(24,25)">
      <rect width="80" height="80" rx="18" fill="url(#icon)" stroke="#45454e"/>
      <g transform="scale(1.6667)">
        <rect x="7" y="7" width="26" height="26" rx="6" fill="none" stroke="#6c6c78" stroke-width="2.5"/>
        <rect x="15" y="15" width="26" height="26" rx="6" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2.5"/>
      </g>
    </g>
    <text x="130" y="62" font-size="28" font-weight="700" fill="#f4f4f7">Claude</text>
    <text x="130" y="92" font-size="18" fill="#9d9da8">com.anthropic.claudefordesktop</text>
    <!-- folder -->
    <path d="M 612 44 h 10 l 4 4 h 14 a 2 2 0 0 1 2 2 v 14 a 2 2 0 0 1 -2 2 h -28 a 2 2 0 0 1 -2 -2 v -18 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <text x="652" y="62" font-size="20" fill="#f4f4f7" opacity="0.9">~/Library/Application Support/Claude</text>
    <!-- person -->
    <circle cx="626" cy="86" r="5" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <path d="M 616 102 a 10 8 0 0 1 20 0" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <text x="652" y="100" font-size="20" fill="#9d9da8">signed in as the personal account</text>
    <circle cx="1100" cy="56" r="7" fill="#56b877"/>
    <text x="1118" y="62" font-size="20" fill="#56b877">running</text>
    <text x="1100" y="100" font-size="20" fill="#9d9da8">plain Dock icon</text>
  </g>

  <!-- row B: the clone -->
  <g transform="translate(520,440)">
    <rect width="1280" height="130" rx="16" fill="#232327" stroke="#d97757" stroke-opacity="0.6"/>
    <g transform="translate(24,25)">
      <rect width="80" height="80" rx="18" fill="url(#icon)" stroke="#45454e"/>
      <g transform="scale(1.6667)">
        <rect x="7" y="7" width="26" height="26" rx="6" fill="none" stroke="#6c6c78" stroke-width="2.5"/>
        <rect x="15" y="15" width="26" height="26" rx="6" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2.5"/>
      </g>
      <!-- the badge iconbadge.js draws: filled circle, white ring, bottom right -->
      <circle cx="57" cy="57" r="18" fill="#d97757" stroke="#ffffff" stroke-width="3"/>
    </g>
    <text x="130" y="62" font-size="28" font-weight="700" fill="#f4f4f7">Claude 2</text>
    <text x="130" y="92" font-size="18" fill="#9d9da8">com.anthropic.claudefordesktop.claude-2</text>
    <path d="M 612 44 h 10 l 4 4 h 14 a 2 2 0 0 1 2 2 v 14 a 2 2 0 0 1 -2 2 h -28 a 2 2 0 0 1 -2 -2 v -18 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <text x="652" y="62" font-size="20" fill="#f4f4f7" opacity="0.9">~/Library/Application Support/Claude 2</text>
    <circle cx="626" cy="86" r="5" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <path d="M 616 102 a 10 8 0 0 1 20 0" fill="none" stroke="#9d9da8" stroke-width="2"/>
    <text x="652" y="100" font-size="20" fill="#9d9da8">signed in as the work account</text>
    <circle cx="1100" cy="56" r="7" fill="#56b877"/>
    <text x="1118" y="62" font-size="20" fill="#56b877">running at the same time</text>
    <text x="1100" y="100" font-size="20" fill="#9d9da8">Dock icon badged <tspan fill="#d97757" font-weight="700">#d97757</tspan></text>
  </g>
</svg>
