<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>App Dualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar"></div>

  <div class="wrap">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <rect x="7" y="7" width="26" height="26" rx="6" class="glyph-back" />
          <rect x="15" y="15" width="26" height="26" rx="6" class="glyph-front" />
        </svg>
      </div>
      <div>
        <h1>App Dualizer</h1>
        <p class="sub" id="tagline">Run two independent copies of an app — separate data, separate login.</p>
      </div>
    </header>

    <!-- STEP 1 — choose app -->
    <section class="card">
      <div class="step-label"><span class="num">1</span> Choose an app</div>

      <div id="drop" class="dropzone" tabindex="0">
        <div id="dropEmpty" class="dropzone-empty">
          <svg viewBox="0 0 24 24" width="26" height="26" class="drop-icon">
            <path d="M12 16V4m0 0L7 9m5-5 5 5M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" />
          </svg>
          <p id="dropHint">Drag an app here <span>or</span></p>
          <button id="browse" class="btn ghost">Browse Applications…</button>
        </div>

        <div id="dropFilled" class="dropzone-filled hidden">
          <img id="appIcon" class="app-icon" alt="" />
          <div class="app-meta">
            <div id="appName" class="app-name"></div>
            <div id="appId" class="app-id"></div>
            <span id="appBadge" class="badge"></span>
          </div>
          <button id="change" class="btn ghost small">Change</button>
        </div>
      </div>
    </section>

    <!-- STEP 2 — configure -->
    <section id="configCard" class="card is-disabled">
      <div class="step-label"><span class="num">2</span> Name &amp; options</div>

      <label class="field">
        <span class="field-label">Clone name</span>
        <input id="name" type="text" placeholder="e.g. Claude 2" autocomplete="off" spellcheck="false" />
        <small id="nameHint" class="hint"></small>
      </label>

      <!-- Windows only: copying the app vs. just making an isolated shortcut. -->
      <div id="modeRow" class="options hidden">
        <label class="opt">
          <input id="modeClone" type="radio" name="mode" value="clone" checked />
          <span class="opt-body">
            <span class="opt-title">Full clone</span>
            <span class="opt-desc">Copies the app so it gets its own name and icon. Needs repair after the app updates itself.</span>
          </span>
        </label>
        <label class="opt">
          <input id="modeLink" type="radio" name="mode" value="link" />
          <span class="opt-body">
            <span class="opt-title">Shortcut only</span>
            <span class="opt-desc">Nothing is copied, so app updates never break it — but both instances share one icon.</span>
          </span>
        </label>
      </div>

      <div class="options">
        <label class="opt">
          <input id="isolate" type="checkbox" checked />
          <span class="opt-body">
            <span class="opt-title">Separate data directory</span>
            <span class="opt-desc">Gives the clone its own login. Recommended.</span>
          </span>
        </label>
        <label class="opt" id="stripOpt">
          <input id="stripSchemes" type="checkbox" />
          <span class="opt-body">
            <span class="opt-title">Remove custom URL schemes</span>
            <span class="opt-desc">Stops the clone from competing for deep links.</span>
          </span>
        </label>
        <label class="opt hidden" id="desktopOpt">
          <input id="desktop" type="checkbox" />
          <span class="opt-body">
            <span class="opt-title">Add a Desktop shortcut</span>
            <span class="opt-desc">A Start Menu entry is always created.</span>
          </span>
        </label>
      </div>
    </section>

    <!-- ACTION -->
    <button id="clone" class="btn primary" disabled>
      <span class="btn-label">Clone app</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <!-- RESULT -->
    <section id="result" class="card result hidden">
      <div class="result-head">
        <span id="resultIcon" class="result-badge"></span>
        <span id="resultText"></span>
      </div>
      <div id="doneActions" class="result-actions hidden">
        <button id="launch" class="btn ghost small">Launch clone</button>
        <button id="reveal" class="btn ghost small">Show in Finder</button>
        <p id="resultNotes" class="notes hidden"></p>
      </div>
      <details class="log-wrap">
        <summary>Show log</summary>
        <pre id="log" class="log"></pre>
      </details>
    </section>

    <footer>Clone only apps you're licensed to use. Respect each app's Terms of Service.</footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
